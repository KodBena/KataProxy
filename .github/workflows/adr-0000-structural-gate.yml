name: ADR-0000 structural and type gate

on:
  push:
    branches: [next]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  structural-and-types:
    name: Import contract, stencil tests, and strict typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check the complete Python import surface
        run: python -m pytest -q tests/test_import_contract.py

      - name: Run structural-boundary and conformance regressions
        run: |
          python -m pytest -q \
            tests/test_stencil_*.py \
            tests/test_roster_admission.py \
            tests/test_role_coverage.py \
            tests/test_cache_verbs.py \
            tests/test_relay_router.py \
            tests/test_selector_router.py \
            tests/test_parse_refusal.py \
            tests/test_visit_scaling.py \
            tests/test_phase3_dispatch.py \
            tests/test_multi_round_adaptation.py \
            tests/test_allocation_algorithms.py \
            tests/test_adaptive_selector_pluggability.py \
            tests/test_adaptive_cache_matrix.py \
            tests/test_allocation_refusal.py \
            tests/test_capability_negotiation.py \
            tests/test_hub_cache_disabled.py \
            tests/test_proxy_logging.py

      - name: Run strict type checking
        run: python -m mypy .
