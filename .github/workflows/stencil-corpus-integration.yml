name: Stencil corpus integration and benchmark

on:
  push:
    branches: [next]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  stencil-corpus-integration:
    name: Real Redis integration and capture benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Redis server
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run isolated real-Redis integration tests and benchmark
        env:
          STENCIL_BENCHMARK_ITERATIONS: "500"
          STENCIL_BENCHMARK_WARMUP: "50"
        run: make test-stencil-corpus-integration

      - name: Upload integration, benchmark, and Redis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stencil-corpus-integration
          path: .artifacts/stencil-corpus/
          if-no-files-found: warn
          retention-days: 14
