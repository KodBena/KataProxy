[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kataproxy"
version = "1.0.14"
description = "A modular, composable protocol proxy and analysis middleware for KataGo."
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.10"
keywords = ["katago", "go", "baduk", "proxy", "websocket", "analysis"]
dependencies = [
    "asteval>=0.9.31",
    "numpy>=1.24",
    "scipy>=1.11",
    "websockets>=12.0",
    "sgfmill>=1.1",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
# Development tooling.
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kataproxy = "proxy_server:main"

[project.urls]
Repository = "https://github.com/KodBena/kataproxy"

[tool.hatch.build.targets.wheel]
# Sub-packages (post-v1.0.14 layout):
#   AbstractProxy     — protocol-agnostic core (proxy_core, protocol_transformer)
#   katago            — KataGo-specific protocol types and parsers
#   transformers      — Layer 1 transformer extensions
#   middleware        — Layer 1 SessionMiddleware ABC + extensions
#   reactive_pipeline — experimental reactive DSL (used only by delta_analysis)
#
# Root-level modules (proxy_server, router, pubsub_hub, sproxy_config,
# logging_config, proxy_json, delta_analysis, registry_interpreter,
# contextual) ride along through `sources = ["."]`.
packages = ["AbstractProxy", "katago", "transformers", "middleware", "reactive_pipeline"]
sources = ["."]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true   # go_transposition, colored_logger are optional natives

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = []
